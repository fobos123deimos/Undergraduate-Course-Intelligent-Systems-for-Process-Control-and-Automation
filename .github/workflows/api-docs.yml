name: Build and publish Python API
# Rendered Tennessee Eastman files are committed by another workflow.
# On successful completion, rebuild docs from the synchronized atlas.
on:
  workflow_run:
    workflows: ['Rebuild Tennessee Eastman figures', 'Rebuild wind turbine figures']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'python/intelligent_control/**'
      - 'docs/pdoc-template/**'
      - 'course/figures/learning/**'
      - 'benchmarks/learning/**'
      - 'benchmarks/figures/**'
      - 'benchmarks/tikz/**'
      - '!benchmarks/tikz/13-tennessee-eastman.tex'
      - '!benchmarks/tikz/12-wind-turbine.tex'
      - 'tools/build_benchmark_atlas.py'
      - 'benchmarks/results/**'
      - 'laboratories/**/results/*.png'
      - 'blending-tank/results/*.png'
      - 'docs/api/**'
      - 'tools/build_api_docs.py'
      - 'requirements*.txt'
      - '.github/workflows/api-docs.yml'
  pull_request:
    paths:
      - 'python/intelligent_control/**'
      - 'docs/pdoc-template/**'
      - 'course/figures/learning/**'
      - 'benchmarks/learning/**'
      - 'benchmarks/figures/**'
      - 'benchmarks/tikz/**'
      - '!benchmarks/tikz/13-tennessee-eastman.tex'
      - '!benchmarks/tikz/12-wind-turbine.tex'
      - 'tools/build_benchmark_atlas.py'
      - 'benchmarks/results/**'
      - 'laboratories/**/results/*.png'
      - 'blending-tank/results/*.png'
      - 'docs/api/**'
      - 'tools/build_api_docs.py'
      - 'requirements*.txt'
      - '.github/workflows/api-docs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-docs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - name: Verify committed figure atlas
        run: python tools/build_benchmark_atlas.py --check
      - name: Verify committed API documentation
        run: python tools/build_api_docs.py --check
      - run: python tools/build_api_docs.py --output build/api
      - run: python tools/build_api_docs.py --output build/api --check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/api
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
