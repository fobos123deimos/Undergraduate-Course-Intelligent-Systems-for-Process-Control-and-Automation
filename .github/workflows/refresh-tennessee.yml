name: Refresh Tennessee Eastman figure
on:
  push:
    paths:
      - 'benchmarks/tikz/13-tennessee-eastman.tex'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX and rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended poppler-utils
          python -m pip install pypdf Jinja2 markdown2 MarkupSafe Pygments
      - name: Compile and render changed figure
        run: |
          cd benchmarks/tikz
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error -output-directory=../figures/tikz 13-tennessee-eastman.tex
          cd ../..
          pdftoppm -singlefile -scale-to 2600 -png benchmarks/figures/tikz/13-tennessee-eastman.pdf benchmarks/figures/tikz/13-tennessee-eastman
          ! grep -E 'Overfull \\hbox|Missing character:|! LaTeX Error' benchmarks/figures/tikz/13-tennessee-eastman.log
      - name: Rebuild atlas and provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader, PdfWriter
          from tools.build_benchmark_atlas import ROOT, OUTPUT, catalog, source_hashes, stems, digest
          data = catalog()
          writer = PdfWriter()
          for c in data['cases']:
              for name in [c['stem']] + ([c['companion']] if c.get('companion') else []):
                  reader = PdfReader(OUTPUT / (name + '.pdf'))
                  assert len(reader.pages)==1, name
                  writer.add_page(reader.pages[0])
                  writer.add_outline_item(c['section']+' '+c['original_name']+(' — signal reference' if name != c['stem'] else ''), len(writer.pages)-1)
          writer.add_metadata({'/Title':'Benchmark atlas — original names, equipment and signal interfaces','/Author':'Intelligent Systems for Process Control and Automation','/Subject':'Kroll and Schulte (2014), sections 3.1–3.13'})
          writer.write(OUTPUT / 'benchmark-atlas.pdf')
          names=stems(data)
          artifacts={n+ext:digest(OUTPUT/(n+ext)) for n in names for ext in ('.pdf','.png')}
          artifacts['benchmark-atlas.pdf']=digest(OUTPUT/'benchmark-atlas.pdf')
          record={
              'generator':'pdfLaTeX / TeX Live and Poppler pdftoppm + pypdf (Tennessee Eastman); unchanged atlas plates reused',
              'paper_sections':13,
              'plates':len(names),
              'png_long_edge':2600,
              'source_sha256_lf':source_hashes(data),
              'artifact_sha256':artifacts,
              'scope':'Original explanatory diagrams; numerical validation status is unchanged.'
          }
          (OUTPUT/'build.json').write_text(json.dumps(record,indent=2)+'\n',encoding='utf-8')
          PY
          python tools/build_benchmark_atlas.py --check
      - name: Update published documentation copies and manifests
        run: |
          python tools/build_api_docs.py
          python tools/build_api_docs.py --check
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/figures/tikz/13-tennessee-eastman.pdf benchmarks/figures/tikz/13-tennessee-eastman.png benchmarks/figures/tikz/benchmark-atlas.pdf benchmarks/figures/tikz/build.json docs/api/
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Tennessee Eastman visual assets and documentation [skip ci]"
            git push
          fi
