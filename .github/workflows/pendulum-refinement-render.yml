name: Render refined inverted-pendulum diagram
on:
  push:
    branches: [main]
    paths:
      - benchmarks/tikz/03-pendulum.tex
      - .github/workflows/pendulum-refinement-render.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pendulum-refinement-graphics
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Keep installation stages bounded and verbose: a stalled mirror must
      # not silently block rendering or hold the concurrency group indefinitely.
      - name: Refresh package indexes with bounded network retries
        timeout-minutes: 3
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 update
      - name: Install TikZ and PDF tooling
        timeout-minutes: 8
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 -o Dpkg::Use-Pty=0 install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
          pdflatex --version
          pdftoppm -v
      - name: Install Python PDF dependency
        timeout-minutes: 2
        run: |
          python -m pip install --disable-pip-version-check --timeout 30 --retries 2 pypdf
      - name: Compile and rasterize updated plate
        timeout-minutes: 3
        run: |
          cd benchmarks/tikz
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error -output-directory=../figures/tikz 03-pendulum.tex
          cd ../..
          pdftoppm -singlefile -scale-to 2600 -png benchmarks/figures/tikz/03-pendulum.pdf benchmarks/figures/tikz/03-pendulum
          python - <<'PY'
          from pathlib import Path
          log = Path('benchmarks/figures/tikz/03-pendulum.log').read_text(errors='replace')
          assert all(s not in log for s in ('Overfull \\hbox', 'Missing character:', '! LaTeX Error')), 'TikZ warning/error; inspect log'
          PY
      - name: Rebuild complete atlas and synchronize documentation
        timeout-minutes: 3
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path
          from pypdf import PdfReader, PdfWriter

          root = Path('.')
          source = root / 'benchmarks/tikz/03-pendulum.tex'
          out = root / 'benchmarks/figures/tikz'
          docs = root / 'docs/api/assets/benchmarks/figures/tikz'
          catalog = json.loads((root / 'benchmarks/tikz/catalog.json').read_text())
          def digest(p, text=False):
              b = p.read_bytes()
              return hashlib.sha256(b.replace(b'\r\n', b'\n') if text else b).hexdigest()

          writer = PdfWriter()
          for case in catalog['cases']:
              names = [case['stem']]
              if case.get('companion'):
                  names.append(case['companion'])
              for name in names:
                  reader = PdfReader(out / (name + '.pdf'))
                  assert len(reader.pages) == 1, name
                  writer.add_page(reader.pages[0])
                  suffix = ' — signal reference' if name != case['stem'] else ''
                  writer.add_outline_item(case['section'] + ' ' + case['original_name'] + suffix, len(writer.pages) - 1)
          writer.add_metadata({
              '/Title': 'Benchmark atlas — original names, equipment and signal interfaces',
              '/Author': 'Intelligent Systems for Process Control and Automation',
              '/Subject': 'Kroll and Schulte (2014), sections 3.1–3.13',
          })
          writer.write(out / 'benchmark-atlas.pdf')

          record_file = out / 'build.json'
          record = json.loads(record_file.read_text())
          record['source_sha256_lf']['benchmarks/tikz/03-pendulum.tex'] = digest(source, text=True)
          for name in ('03-pendulum.pdf', '03-pendulum.png', 'benchmark-atlas.pdf'):
              record['artifact_sha256'][name] = digest(out / name)
          record['generator'] = 'Tectonic and pdfLaTeX (existing plates); pdfLaTeX / TeX Live (cart-pendulum); Poppler + pypdf'
          record['incremental_build'] = {
              'plate': '03-pendulum',
              'compiler': 'pdfLaTeX (GitHub Actions)',
              'reused_plates': 13,
              'scope': 'Indoor mechatronics lab background, precision workbench and frosted glazing; approved mechanism and model unchanged.',
          }
          record_file.write_text(json.dumps(record, indent=2, ensure_ascii=False) + '\n')

          docs.mkdir(parents=True, exist_ok=True)
          for name in ('03-pendulum.png', 'benchmark-atlas.pdf'):
              shutil.copyfile(out / name, docs / name)

          api_file = root / 'docs/api/build.json'
          api = json.loads(api_file.read_text())
          for name in ('03-pendulum.png', 'benchmark-atlas.pdf'):
              api['source_sha256_lf'][f'benchmarks/figures/tikz/{name}'] = digest(out / name)
              api['artifact_sha256'][f'assets/benchmarks/figures/tikz/{name}'] = digest(docs / name)
          api_file.write_text(json.dumps(api, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Verify committed figure records
        timeout-minutes: 3
        run: |
          python tools/build_benchmark_atlas.py --check
          git diff --check
      - name: Commit rendered figure and atlas
        timeout-minutes: 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/tikz/03-pendulum.tex benchmarks/figures/tikz/03-pendulum.pdf benchmarks/figures/tikz/03-pendulum.png benchmarks/figures/tikz/benchmark-atlas.pdf benchmarks/figures/tikz/build.json docs/api/assets/benchmarks/figures/tikz/03-pendulum.png docs/api/assets/benchmarks/figures/tikz/benchmark-atlas.pdf docs/api/build.json
          if ! git diff --cached --quiet; then
            git commit -m "Refine inverted pendulum and regenerate atlas assets"
            git push origin HEAD:main
          fi
