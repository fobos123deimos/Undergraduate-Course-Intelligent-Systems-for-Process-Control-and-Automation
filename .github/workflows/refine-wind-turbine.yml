name: Render proposed wind-turbine refinement
on:
  push:
    branches: [refine-wind-turbine-realism-2026-11-06]
    paths:
      - 'benchmarks/tikz/12-wind-turbine.tex'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install vector-rendering toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-fonts-recommended lmodern poppler-utils
          python -m pip install 'pypdf>=5,<7'
      - name: Render the revised source and raster preview
        run: |
          cd benchmarks/tikz
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error -output-directory=../figures/tikz 12-wind-turbine.tex
          pdftoppm -f 1 -l 1 -singlefile -scale-to 2600 -png ../figures/tikz/12-wind-turbine.pdf ../figures/tikz/12-wind-turbine
      - name: Reassemble 14-plate atlas and refresh integrity records
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          import struct
          from pathlib import Path
          from pypdf import PdfReader, PdfWriter

          root = Path('.')
          art = root / 'benchmarks/figures/tikz'
          source = root / 'benchmarks/tikz/12-wind-turbine.tex'
          png = art / '12-wind-turbine.png'
          pdf = art / '12-wind-turbine.pdf'
          def hash_file(p, text=False):
              raw = p.read_bytes()
              return hashlib.sha256(raw.replace(b'\r\n', b'\n') if text else raw).hexdigest()
          assert png.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n'
          assert max(struct.unpack('>II', png.read_bytes()[16:24])) >= 2500
          assert len(PdfReader(pdf).pages) == 1

          catalog = json.loads((root/'benchmarks/tikz/catalog.json').read_text())
          writer = PdfWriter()
          for case in catalog['cases']:
              names = [case['stem']] + ([case['companion']] if case.get('companion') else [])
              for name in names:
                  source_pdf = PdfReader(art / (name+'.pdf'))
                  assert len(source_pdf.pages) == 1, name
                  writer.add_page(source_pdf.pages[0])
                  suffix = ' — signal reference' if name != case['stem'] else ''
                  writer.add_outline_item(case['section']+' '+case['original_name']+suffix, len(writer.pages)-1)
          writer.add_metadata({'/Title':'Benchmark atlas — original names, equipment and signal interfaces','/Author':'Intelligent Systems for Process Control and Automation','/Subject':'Kroll and Schulte (2014), sections 3.1–3.13'})
          writer.write(art/'benchmark-atlas.pdf')
          record_path = art/'build.json'
          record = json.loads(record_path.read_text())
          record['source_sha256_lf']['benchmarks/tikz/12-wind-turbine.tex'] = hash_file(source, True)
          for filename in ('12-wind-turbine.png', '12-wind-turbine.pdf', 'benchmark-atlas.pdf'):
              record['artifact_sha256'][filename] = hash_file(art/filename)
          record['incremental_build'] = {'plate':'12-wind-turbine','compiler':'pdfLaTeX (GitHub Actions)','reused_plates':13,'scope':'Materials, light and vegetation; equations, coordinates and port topology unchanged.'}
          record_path.write_text(json.dumps(record,indent=2,ensure_ascii=False)+'\n')

          documentation = root/'docs/api'
          doc_record_path = documentation/'build.json'
          doc_record = json.loads(doc_record_path.read_text())
          for filename in ('12-wind-turbine.png','benchmark-atlas.pdf'):
              key = f'benchmarks/figures/tikz/{filename}'
              dest = documentation/'assets'/key
              assert dest.exists() and key in doc_record['source_sha256_lf']
              shutil.copyfile(art/filename, dest)
              doc_record['source_sha256_lf'][key] = hash_file(art/filename)
              doc_record['artifact_sha256']['assets/'+key] = hash_file(dest)
          doc_record_path.write_text(json.dumps(doc_record,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Verify original data and generated artifacts
        run: |
          python tools/build_benchmark_atlas.py --check
          python tools/build_api_docs.py --check
      - name: Commit verified render to proposal branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/figures/tikz/12-wind-turbine.pdf benchmarks/figures/tikz/12-wind-turbine.png benchmarks/figures/tikz/benchmark-atlas.pdf benchmarks/figures/tikz/build.json docs/api/assets/benchmarks/figures/tikz/12-wind-turbine.png docs/api/assets/benchmarks/figures/tikz/benchmark-atlas.pdf docs/api/build.json
          if ! git diff --cached --quiet; then
            git commit -m "Render refined wind turbine plate and refresh atlas"
            git push
          fi
