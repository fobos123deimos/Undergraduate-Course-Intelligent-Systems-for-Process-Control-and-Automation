name: Render refined servo-pneumatic actuator
on:
  push:
    branches: [main]
    paths:
      - benchmarks/tikz/05-pneumatic.tex
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pneumatic-refinement-graphics
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TikZ and vector-graphics tooling
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
          python -m pip install pypdf pymupdf
      - name: Compile and render reviewed servo-pneumatic plate
        run: |
          cd benchmarks/tikz
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error -output-directory=../figures/tikz 05-pneumatic.tex
          cd ../..
          pdftoppm -singlefile -scale-to 2600 -png benchmarks/figures/tikz/05-pneumatic.pdf benchmarks/figures/tikz/05-pneumatic
          python - <<'PY'
          from pathlib import Path
          import fitz, shutil, struct
          from xml.etree import ElementTree as ET
          root = Path('.')
          out = root/'benchmarks/figures/tikz'
          legacy = root/'benchmarks/figures'
          log = (out/'05-pneumatic.log').read_text(errors='replace')
          for warning in ('Overfull \\hbox','Underfull \\hbox','Missing character:','! LaTeX Error'):
              assert warning not in log, warning
          reader = fitz.open(str(out/'05-pneumatic.pdf'))
          assert len(reader)==1
          svg = reader[0].get_svg_image(text_as_path=True)
          (legacy/'05-pneumatic.svg').write_text(svg,encoding='utf-8')
          ET.fromstring(svg)
          shutil.copyfile(out/'05-pneumatic.png',legacy/'05-pneumatic.png')
          b = (out/'05-pneumatic.png').read_bytes()
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          assert max(struct.unpack('>II',b[16:24])) >= 2600
          PY
      - name: Rebuild benchmark atlas and synchronize API figures
        run: |
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          from pypdf import PdfReader,PdfWriter
          root=Path('.')
          out=root/'benchmarks/figures/tikz'
          docs=root/'docs/api/assets/benchmarks/figures/tikz'
          catalog=json.loads((root/'benchmarks/tikz/catalog.json').read_text())
          def sha(path,text=False):
              data=path.read_bytes()
              return hashlib.sha256(data.replace(b'\r\n',b'\n') if text else data).hexdigest()
          writer=PdfWriter()
          for case in catalog['cases']:
              stems=[case['stem']]+([case['companion']] if case.get('companion') else [])
              for stem in stems:
                  doc=PdfReader(out/(stem+'.pdf'))
                  assert len(doc.pages)==1,stem
                  writer.add_page(doc.pages[0])
                  writer.add_outline_item(case['section']+' '+case['original_name']+(' — signal reference' if stem!=case['stem'] else ''),len(writer.pages)-1)
          writer.add_metadata({'/Title':'Benchmark atlas — original names, equipment and signal interfaces','/Author':'Intelligent Systems for Process Control and Automation','/Subject':'Kroll and Schulte (2014), sections 3.1–3.13'})
          writer.write(out/'benchmark-atlas.pdf')
          record_path=out/'build.json'
          record=json.loads(record_path.read_text())
          record['source_sha256_lf']['benchmarks/tikz/05-pneumatic.tex']=sha(root/'benchmarks/tikz/05-pneumatic.tex',True)
          for n in ('05-pneumatic.pdf','05-pneumatic.png','benchmark-atlas.pdf'):
              record['artifact_sha256'][n]=sha(out/n)
          record['generator']='Tectonic/pdfLaTeX (unchanged plates); pdfLaTeX (servo-pneumatic actuator); Poppler, PyMuPDF and pypdf'
          record['incremental_build']={'plate':'05-pneumatic','compiler':'pdfLaTeX (GitHub Actions)','reused_plates':13,'scope':'Article Fig. 4 topology: left vertical double-rod cylinder, right spool valve, explicit four mass-flow ports and time-varying load; calibrated SI teaching variant remains separate.'}
          record_path.write_text(json.dumps(record,indent=2,ensure_ascii=False)+'\n')
          docs.mkdir(parents=True,exist_ok=True)
          for n in ('05-pneumatic.png','benchmark-atlas.pdf'):
              shutil.copyfile(out/n,docs/n)
          api_file=root/'docs/api/build.json'
          api=json.loads(api_file.read_text())
          for n in ('05-pneumatic.png','benchmark-atlas.pdf'):
              api['source_sha256_lf'][f'benchmarks/figures/tikz/{n}']=sha(out/n)
              api['artifact_sha256'][f'assets/benchmarks/figures/tikz/{n}']=sha(docs/n)
          api_file.write_text(json.dumps(api,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Check atlas reproducibility and touched artifacts
        run: |
          python tools/build_benchmark_atlas.py --check
          python - <<'PY'
          from pathlib import Path
          assert (Path('benchmarks/figures/05-pneumatic.png').read_bytes() == Path('benchmarks/figures/tikz/05-pneumatic.png').read_bytes())
          assert (Path('benchmarks/figures/05-pneumatic.svg').stat().st_size > 20000)
          PY
          git diff --check
      - name: Commit refined plate and linked image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/tikz/05-pneumatic.tex benchmarks/figures/05-pneumatic.png benchmarks/figures/05-pneumatic.svg benchmarks/figures/tikz/05-pneumatic.pdf benchmarks/figures/tikz/05-pneumatic.png benchmarks/figures/tikz/benchmark-atlas.pdf benchmarks/figures/tikz/build.json docs/api/assets/benchmarks/figures/tikz/05-pneumatic.png docs/api/assets/benchmarks/figures/tikz/benchmark-atlas.pdf docs/api/build.json
          if ! git diff --cached --quiet; then
            git commit -m "Refine servo-pneumatic Figure 4 and synchronize benchmark visuals"
            git push origin HEAD:main
          fi
